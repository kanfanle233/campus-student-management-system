<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">CampusFlow system workflow / 校园学生信息管理系统流程图</title>
  <desc id="desc">The user chooses the local Flask API or the static browser demo, performs student data operations, validates the request, persists data, and receives a success or error response.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef5ff"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#12233f"/>
      <stop offset="1" stop-color="#1c4776"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#7893b7" flood-opacity=".16"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#47709c"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#209272"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "PingFang SC", sans-serif; fill: #172b4d; }
      .title { fill: #ffffff; font-size: 32px; font-weight: 750; letter-spacing: .3px; }
      .subtitle { fill: #c4d7f0; font-size: 16px; }
      .node-title { font-size: 19px; font-weight: 720; }
      .node-copy { font-size: 15px; fill: #57708f; }
      .small { font-size: 14px; fill: #6b84a2; }
      .pill { font-size: 13px; font-weight: 700; letter-spacing: .6px; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="url(#bg)"/>
  <rect x="56" y="42" width="1328" height="112" rx="26" fill="url(#hero)" filter="url(#shadow)"/>
  <circle cx="1262" cy="93" r="80" fill="#5ec9b5" opacity=".11"/>
  <circle cx="1323" cy="66" r="42" fill="#ffcf79" opacity=".12"/>
  <text x="92" y="91" class="title">业务流程图 · System Workflow</text>
  <text x="92" y="122" class="subtitle">CampusFlow / 蹦迪项目：从页面操作到持久化结果的完整路径</text>

  <g filter="url(#shadow)">
    <rect x="92" y="212" width="216" height="112" rx="18" fill="#ffffff" stroke="#c9d9ef" stroke-width="2"/>
    <rect x="92" y="212" width="216" height="9" rx="5" fill="#3e79bd"/>
    <text x="116" y="256" class="node-title">开始 · Start</text>
    <text x="116" y="282" class="node-copy">打开管理页面</text>
    <text x="116" y="305" class="small">Open the management UI</text>
  </g>

  <path d="M308 268 H362" fill="none" stroke="#47709c" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="362" y="190" width="294" height="156" rx="18" fill="#ffffff" stroke="#c9d9ef" stroke-width="2"/>
    <rect x="362" y="190" width="294" height="9" rx="5" fill="#8a72ce"/>
    <text x="388" y="233" class="node-title">选择运行模式</text>
    <text x="388" y="258" class="node-copy">Choose a runtime mode</text>
    <rect x="388" y="278" width="112" height="37" rx="18" fill="#e9f1ff"/>
    <text x="444" y="302" text-anchor="middle" class="pill" fill="#3e79bd">Flask API</text>
    <rect x="512" y="278" width="118" height="37" rx="18" fill="#e7f7f2"/>
    <text x="571" y="302" text-anchor="middle" class="pill" fill="#208768">静态演示</text>
  </g>

  <path d="M656 240 C700 240 700 240 740 240" fill="none" stroke="#47709c" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M656 302 C700 302 700 430 740 430" fill="none" stroke="#209272" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="687" y="227" class="small" fill="#47709c">本地服务</text>
  <text x="680" y="361" class="small" fill="#209272">无需服务器</text>

  <g filter="url(#shadow)">
    <rect x="740" y="178" width="274" height="126" rx="18" fill="#ffffff" stroke="#c9d9ef" stroke-width="2"/>
    <rect x="740" y="178" width="274" height="9" rx="5" fill="#3e79bd"/>
    <text x="766" y="222" class="node-title">浏览器 → Flask</text>
    <text x="766" y="249" class="node-copy">ApiAdapter 发送请求</text>
    <text x="766" y="276" class="small">web/ · app.py · /api/*</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="740" y="368" width="274" height="126" rx="18" fill="#ffffff" stroke="#c9d9ef" stroke-width="2"/>
    <rect x="740" y="368" width="274" height="9" rx="5" fill="#209272"/>
    <text x="766" y="412" class="node-title">浏览器本地演示</text>
    <text x="766" y="439" class="node-copy">LocalAdapter 读写存储</text>
    <text x="766" y="466" class="small">docs/ · localStorage</text>
  </g>

  <path d="M1014 241 H1056" fill="none" stroke="#47709c" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1014 431 H1056" fill="none" stroke="#209272" stroke-width="3" marker-end="url(#arrowGreen)"/>

  <g filter="url(#shadow)">
    <rect x="1056" y="185" width="292" height="142" rx="18" fill="#ffffff" stroke="#c9d9ef" stroke-width="2"/>
    <rect x="1056" y="185" width="292" height="9" rx="5" fill="#f0a247"/>
    <text x="1082" y="229" class="node-title">业务操作 · Operations</text>
    <text x="1082" y="256" class="node-copy">查询 / 添加 / 修改 / 删除</text>
    <text x="1082" y="282" class="node-copy">搜索 / 筛选 / 导入 / 导出</text>
    <text x="1082" y="307" class="small">CRUD · Search · CSV</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1056" y="368" width="292" height="126" rx="18" fill="#ffffff" stroke="#c9d9ef" stroke-width="2"/>
    <rect x="1056" y="368" width="292" height="9" rx="5" fill="#f06d83"/>
    <text x="1082" y="412" class="node-title">校验请求 · Validate</text>
    <text x="1082" y="439" class="node-copy">必填、年龄、性别、电话</text>
    <text x="1082" y="466" class="small">duplicate ID · batch validation</text>
  </g>

  <path d="M1202 327 V368" fill="none" stroke="#47709c" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1202 494 V548" fill="none" stroke="#47709c" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="728" y="548" width="478" height="142" rx="20" fill="#12233f"/>
    <rect x="728" y="548" width="12" height="142" rx="6" fill="#5ec9b5"/>
    <text x="766" y="594" class="node-title" fill="#ffffff">持久化与统计 · Persist &amp; Measure</text>
    <text x="766" y="622" class="node-copy" fill="#c4d7f0">student_service.py 统一处理业务逻辑</text>
    <text x="766" y="649" class="node-copy" fill="#c4d7f0">JSON 原子写入 · CSV 导入导出 · 仪表盘统计</text>
    <text x="766" y="675" class="small" fill="#9fb6d5">data/students.json  /  browser localStorage</text>
  </g>

  <path d="M728 620 C630 620 632 748 548 748" fill="none" stroke="#47709c" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1206 620 C1277 620 1268 748 1196 748" fill="none" stroke="#47709c" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="252" y="716" width="296" height="110" rx="18" fill="#e7f7f2" stroke="#a8ddcc" stroke-width="2"/>
    <text x="282" y="758" class="node-title" fill="#17694f">成功 · Success</text>
    <text x="282" y="785" class="node-copy" fill="#397967">更新表格、统计和成功提示</text>
    <text x="282" y="808" class="small" fill="#397967">Render the latest state</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="892" y="716" width="304" height="110" rx="18" fill="#fff0f2" stroke="#f2bbc4" stroke-width="2"/>
    <text x="922" y="758" class="node-title" fill="#b34d60">失败 · Error</text>
    <text x="922" y="785" class="node-copy" fill="#a46672">返回错误码、字段和行号</text>
    <text x="922" y="808" class="small" fill="#a46672">Keep the original data</text>
  </g>

  <text x="720" y="866" text-anchor="middle" class="small">Every mutation follows the same validate → persist → feedback cycle.</text>
</svg>
