<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">CampusFlow system architecture / 校园学生信息管理系统架构图</title>
  <desc id="desc">A layered architecture diagram showing the browser UI, frontend adapters, Flask HTTP routes, the shared student service, JSON storage, static GitHub Pages storage, and tests.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfcff"/>
      <stop offset="1" stop-color="#edf4ff"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#12233f"/>
      <stop offset="1" stop-color="#1c4776"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#7893b7" flood-opacity=".16"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#47709c"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#209272"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "PingFang SC", sans-serif; fill: #172b4d; }
      .title { fill: #ffffff; font-size: 32px; font-weight: 750; }
      .subtitle { fill: #c4d7f0; font-size: 16px; }
      .layer-label { font-size: 14px; font-weight: 750; letter-spacing: 1.4px; fill: #66809f; }
      .box-title { font-size: 19px; font-weight: 720; }
      .box-copy { font-size: 15px; fill: #57708f; }
      .small { font-size: 13px; fill: #7188a3; }
      .dark-title { fill: #ffffff; font-size: 19px; font-weight: 720; }
      .dark-copy { fill: #c4d7f0; font-size: 15px; }
      .dark-small { fill: #9fb6d5; font-size: 13px; }
    </style>
  </defs>

  <rect width="1440" height="960" fill="url(#bg)"/>
  <rect x="56" y="42" width="1328" height="112" rx="26" fill="url(#hero)" filter="url(#shadow)"/>
  <circle cx="1244" cy="96" r="88" fill="#5ec9b5" opacity=".11"/>
  <circle cx="1322" cy="60" r="45" fill="#ffcf79" opacity=".13"/>
  <text x="92" y="91" class="title">系统架构图 · System Architecture</text>
  <text x="92" y="122" class="subtitle">共享业务服务，支持本地 API 与 GitHub Pages 两种运行方式</text>

  <text x="90" y="203" class="layer-label">01 · PRESENTATION / 界面</text>
  <g filter="url(#shadow)">
    <rect x="92" y="224" width="420" height="142" rx="18" fill="#ffffff" stroke="#c9d9ef" stroke-width="2"/>
    <rect x="92" y="224" width="10" height="142" rx="5" fill="#3e79bd"/>
    <text x="124" y="267" class="box-title">本地管理界面 · Local UI</text>
    <text x="124" y="295" class="box-copy">web/index.html · web/styles.css</text>
    <text x="124" y="322" class="box-copy">响应式导航、表格、表单、详情和提示</text>
    <text x="124" y="348" class="small">HTML · CSS · JavaScript</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="548" y="224" width="420" height="142" rx="18" fill="#ffffff" stroke="#c9d9ef" stroke-width="2"/>
    <rect x="548" y="224" width="10" height="142" rx="5" fill="#209272"/>
    <text x="580" y="267" class="box-title">静态 Pages 界面 · Static UI</text>
    <text x="580" y="295" class="box-copy">docs/index.html · docs/assets/*</text>
    <text x="580" y="322" class="box-copy">内置样例数据，浏览器本地保存修改</text>
    <text x="580" y="348" class="small">GitHub Pages · localStorage</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1004" y="224" width="344" height="142" rx="18" fill="#ffffff" stroke="#c9d9ef" stroke-width="2"/>
    <rect x="1004" y="224" width="10" height="142" rx="5" fill="#8a72ce"/>
    <text x="1036" y="267" class="box-title">前端适配器 · Adapters</text>
    <text x="1036" y="295" class="box-copy">ApiAdapter → HTTP API</text>
    <text x="1036" y="322" class="box-copy">LocalAdapter → localStorage</text>
    <text x="1036" y="348" class="small">相同页面操作，不同数据出口</text>
  </g>

  <path d="M512 295 H548" fill="none" stroke="#47709c" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M968 295 H1004" fill="none" stroke="#47709c" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="90" y="414" class="layer-label">02 · APPLICATION / 应用</text>
  <g filter="url(#shadow)">
    <rect x="92" y="435" width="390" height="156" rx="18" fill="#ffffff" stroke="#c9d9ef" stroke-width="2"/>
    <rect x="92" y="435" width="10" height="156" rx="5" fill="#f0a247"/>
    <text x="124" y="479" class="box-title">Flask HTTP 层</text>
    <text x="124" y="507" class="box-copy">app.py</text>
    <text x="124" y="534" class="box-copy">路由、请求解析、响应状态码</text>
    <text x="124" y="561" class="box-copy">/api/students · /api/stats · /api/health</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="526" y="435" width="468" height="156" rx="18" fill="#12233f"/>
    <rect x="526" y="435" width="10" height="156" rx="5" fill="#5ec9b5"/>
    <text x="558" y="479" class="dark-title">共享业务服务 · Shared Service</text>
    <text x="558" y="507" class="dark-copy">student_service.py</text>
    <text x="558" y="534" class="dark-copy">validate · CRUD · CSV · statistics</text>
    <text x="558" y="561" class="dark-copy">StudentServiceError · student_main()</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1038" y="435" width="310" height="156" rx="18" fill="#ffffff" stroke="#c9d9ef" stroke-width="2"/>
    <rect x="1038" y="435" width="10" height="156" rx="5" fill="#f06d83"/>
    <text x="1070" y="479" class="box-title">输入规则 · Validation</text>
    <text x="1070" y="507" class="box-copy">必填字段与未知字段</text>
    <text x="1070" y="534" class="box-copy">年龄、性别、电话格式</text>
    <text x="1070" y="561" class="box-copy">重复学号与整批 CSV 校验</text>
  </g>

  <path d="M1176 366 V404 C1176 420 1210 420 1210 435" fill="none" stroke="#47709c" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M712 366 V435" fill="none" stroke="#47709c" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M482 513 H526" fill="none" stroke="#47709c" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M994 513 H1038" fill="none" stroke="#47709c" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="90" y="642" class="layer-label">03 · DATA &amp; QUALITY / 数据与质量</text>
  <g filter="url(#shadow)">
    <rect x="92" y="663" width="350" height="156" rx="18" fill="#ffffff" stroke="#c9d9ef" stroke-width="2"/>
    <rect x="92" y="663" width="10" height="156" rx="5" fill="#3e79bd"/>
    <text x="124" y="707" class="box-title">JSON 持久化</text>
    <text x="124" y="735" class="box-copy">data/students.json</text>
    <text x="124" y="762" class="box-copy">临时文件 → os.replace</text>
    <text x="124" y="789" class="small">原子写入，避免半份文件</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="486" y="663" width="350" height="156" rx="18" fill="#ffffff" stroke="#c9d9ef" stroke-width="2"/>
    <rect x="486" y="663" width="10" height="156" rx="5" fill="#209272"/>
    <text x="518" y="707" class="box-title">浏览器存储</text>
    <text x="518" y="735" class="box-copy">docs/assets/app.js</text>
    <text x="518" y="762" class="box-copy">localStorage · 8 条演示数据</text>
    <text x="518" y="789" class="small">无服务器请求</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="880" y="663" width="350" height="156" rx="18" fill="#ffffff" stroke="#c9d9ef" stroke-width="2"/>
    <rect x="880" y="663" width="10" height="156" rx="5" fill="#8a72ce"/>
    <text x="912" y="707" class="box-title">自动化检查</text>
    <text x="912" y="735" class="box-copy">tests/ · pytest</text>
    <text x="912" y="762" class="box-copy">compileall · build_pages.py --check</text>
    <text x="912" y="789" class="small">接口、数据和静态发布检查</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1274" y="663" width="74" height="156" rx="18" fill="#fff0f2" stroke="#f2bbc4" stroke-width="2"/>
    <text x="1311" y="714" text-anchor="middle" class="box-title" fill="#b34d60">CSV</text>
    <text x="1311" y="744" text-anchor="middle" class="box-copy" fill="#a46672">导入</text>
    <text x="1311" y="771" text-anchor="middle" class="box-copy" fill="#a46672">导出</text>
    <text x="1311" y="798" text-anchor="middle" class="small" fill="#a46672">UTF-8</text>
  </g>

  <path d="M712 591 V625 C712 645 267 632 267 663" fill="none" stroke="#47709c" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M712 591 V625 C712 645 661 632 661 663" fill="none" stroke="#209272" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <path d="M1210 591 V625 C1210 645 1055 632 1055 663" fill="none" stroke="#47709c" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1230 741 H1274" fill="none" stroke="#47709c" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="720" y="883" text-anchor="middle" class="small">One domain service, two presentation modes, one documented data contract.</text>
</svg>
